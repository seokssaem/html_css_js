<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 소개 페이지</title>

    <!-- 내부 스타일 시트 -->
    <style>
        h1 {
            font-size: 200px;
            color: hotpink;
            font-weight: 900;
        }
        .accent {
            font-size: 50px;
            font-weight: 900;
        }
        .italic {
            font-weight: bold;
            font-style: italic;
        }
    </style>
    
</head>
<body>
    <h1>레드향</h1>
    <p>껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 한다.</p>
    <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p class="italic">비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>

</body>
</html>
