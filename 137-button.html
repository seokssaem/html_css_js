<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버튼에 동적인 효과 만들기</title>

    <style>
        body {
            background-image: linear-gradient(to right, #ff5e62, #ff9966);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .button {
            text-decoration: none;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #fff;
            outline: 2px solid #fff;
            padding: 20px 60px;
            position: relative;
            overflow: hidden;
            transition: color 1s;
        }
        .button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -50px;
            width: 0;
            height: 100%;
            background-color: #fff;
            z-index: -10;
            transform: skewX(35deg);
            transition: width 1s;
        }
        .button:hover {
            color: #ff5e62;
        }
        .button:hover::before {
            width: 150%;
        }

        /* 왼쪽에서 진입하는 효과 */
        .button::before {
            left: -50px;
            /* hover 시 width: 150% */
        }

        /* 오른쪽에서 진입하는 효과 */
        .button::after {
            content: "";
            position: absolute;
            top: 0;
            right: -50px;    /* ← 오른쪽 밖에서 시작 */
            width: 0;
            height: 100%;
            background-color: rgba(255,255,255,0.3);
            z-index: -10;
            transform: skewX(-35deg);   /* ← 반대 방향으로 기울임 */
            transition: width 1s;
        }

        .button:hover::after {
            width: 150%;
        }
    </style>

</head>
<body>
    <a href="#" class="button">둘러보기</a>
</body>
</html>
