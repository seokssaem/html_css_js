<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트랜지션 - translate 함수</title>

    <style>
        .container {
            width: 800px;
            height: 200px;
            margin: 20px auto;
        }
        .origin {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin: 40px;
            float: left;
        }
        .origin > div {
            width: 100px;
            height: 100px;
            background-color: orange;
            transition: 0.5s;
        }
        #movex:hover {
            transform: translateX(50px);
        }
        #movey:hover {
            transform: translateY(20px);
        }
        #movexy:hover {
            transform: translate(10px, 20px);
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="origin">
            <div id="movex"></div>
        </div>

        <div class="origin">
            <div id="movey"></div>
        </div>
        
        <div class="origin">
            <div id="movexy"></div>
        </div>        
    </div>
</body>
</html>
