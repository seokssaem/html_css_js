<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 소개 페이지</title>

    <!-- 내부 CSS 스타일 시트 -->
    <style>
        /* body {
            background: url('images/bg-2.jpg') no-repeat fixed;
            background-size: cover;
            text-align: center;
        } */
        h1 {
            font-size: 80px;
            color: rgba(221, 255, 157, 0.5);
        }
        .heading {
            width: 100%;
            height: 150px;
            background: #222;
            color: #fff;
            text-align: center;
            line-height: 150px;
        }
        p {
            width: 410px;
            border: 1px solid #222;
            padding: 10px;
            margin: 10px;
            font-size: 1.1em;
        }
        .small-line {
            line-height: 0.7;
        }
        .big-line {
            line-height: 2.5;
        }

    </style>

</head>
<body>
    <h1 class="heading">HTML</h1>

    <p>껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다. 레드향은 한라봉과 귤을 교배한 것으로 
        일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p class="small-line">껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다. 레드향은 한라봉과 귤을 교배한 것으로 
        일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p class="big-line">껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다. 레드향은 한라봉과 귤을 교배한 것으로 
        일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    
</body>
</html>
